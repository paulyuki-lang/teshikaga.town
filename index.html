
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>てしかが冒険クエスト</title>

<style>
* { box-sizing: border-box; }

:root {
  --green: #315c42;
  --gold: #d5ad53;
  --cream: #fffdf3;
}

body {
  margin: 0;
  color: #304b39;
  font-family: "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
  background: linear-gradient(#dcefe9, #edf2d9);
  min-height: 100vh;
}

header {
  position: relative;
  text-align: center;
  padding: 24px 15px 32px;
  color: white;
  background: linear-gradient(145deg, #193f35, #57885b);
  border-bottom: 5px solid var(--gold);
}

header h1 {
  font-size: clamp(25px, 5vw, 44px);
  margin: 16px 0 8px;
}

header p { margin: 8px; }

.language {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

select {
  padding: 8px 12px;
  border: 1px solid #b5c7b0;
  border-radius: 10px;
  background: #fffdf3;
  color: #315c42;
  font-size: 15px;
}

main {
  max-width: 1150px;
  margin: auto;
  padding: 16px;
}

.panel {
  background: var(--cream);
  border: 2px solid #c3c7a4;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 5px 15px #284c3215;
}

.panel h2 { margin-top: 0; }

.stamp-book {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.stamp {
  min-width: 0;
  text-align: center;
  padding: 12px 3px;
  border: 2px dashed #b6c0a7;
  background: #eef0e4;
  border-radius: 13px;
  color: #75806c;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.stamp-icon {
  display: block;
  font-size: clamp(23px, 4vw, 38px);
  margin-bottom: 6px;
  filter: grayscale(1);
  opacity: .35;
}

.stamp.earned {
  background: #fff1bb;
  border: 2px solid #d8ad46;
  color: #72591e;
}

.stamp.earned .stamp-icon {
  filter: none;
  opacity: 1;
  animation: pop .4s;
}

@keyframes pop {
  50% { transform: scale(1.3) rotate(-10deg); }
}

.status {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 16px 0 8px;
  font-weight: bold;
}

.progress {
  height: 17px;
  border-radius: 20px;
  background: #e0e5d5;
  overflow: hidden;
}

#progressBar {
  width: 0%;
  height: 100%;
  border-radius: 20px;
  background: linear-gradient(90deg, #55965c, #e7cb65);
  transition: width .5s;
}

#rank {
  font-size: 14px;
  text-align: center;
  color: #657c48;
}

.map {
  position: relative;
  aspect-ratio: 900 / 650;
  border: 5px solid #9a8057;
  border-radius: 18px;
  overflow: hidden;
  background: #b7d9a0;
  isolation: isolate;
}

.landscape {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.pin {
  position: absolute;
  z-index: 5;
  transform: translate(-50%, -50%);
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 0;
  font-family: inherit;
}

.pin-icon {
  display: grid;
  place-items: center;
  width: clamp(34px, 6vw, 58px);
  height: clamp(34px, 6vw, 58px);
  border-radius: 50%;
  border: 3px solid #b7944e;
  background: #fff9e5;
  font-size: clamp(20px, 4vw, 32px);
  box-shadow: 0 4px 5px #183f3655;
  transition: transform .2s;
}

.pin:hover .pin-icon,
.pin:focus-visible .pin-icon {
  transform: scale(1.2);
}

.pin-name {
  background: #fffdf0;
  color: #31543c;
  border: 1px solid #9eac83;
  border-radius: 7px;
  padding: 4px 7px;
  font-size: clamp(9px, 1.6vw, 14px);
  font-weight: bold;
  max-width: 130px;
  text-align: center;
}

.pin.visited .pin-icon {
  background: #ffe078;
}

.pin.selected .pin-name {
  color: white;
  background: #315c42;
}

#bear {
  position: absolute;
  left: 65%;
  top: 91%;
  width: clamp(40px, 8vw, 85px);
  transform: translate(-50%, -100%);
  transition: left 1.2s ease, top 1.2s ease;
  pointer-events: none;
  z-index: 9;
  filter: drop-shadow(0 4px 3px #0003);
}

#bear svg { width: 100%; }

.cloud {
  animation: cloudMove 18s ease-in-out infinite alternate;
}

@keyframes cloudMove {
  to { transform: translateX(45px); }
}

.steam {
  animation: steamMove 3s ease-in-out infinite;
}

@keyframes steamMove {
  0% { opacity: .2; transform: translateY(8px); }
  50% { opacity: .85; }
  100% { opacity: .1; transform: translateY(-12px); }
}

.water-shine {
  animation: shimmer 4s ease-in-out infinite alternate;
}

@keyframes shimmer {
  to { opacity: .2; }
}

.guide {
  display: flex;
  align-items: center;
  gap: 16px;
}

.avatar {
  width: 90px;
  flex-shrink: 0;
}

.avatar svg { width: 100%; }

.speech {
  background: #eaf2df;
  padding: 15px;
  border-radius: 15px;
  line-height: 1.8;
  flex: 1;
}

.detail {
  margin-top: 12px;
  padding: 14px;
  background: #f0f4e6;
  border-left: 4px solid #7caa67;
  border-radius: 8px;
  line-height: 1.8;
}

.detail h3 { margin: 0 0 6px; }

#reward {
  color: #9c731c;
  font-weight: bold;
}

.note {
  font-size: 12px;
  color: #6d8069;
}

#clearPanel {
  text-align: center;
  border-color: var(--gold);
  background: #fff4cc;
}

.trophy { font-size: 65px; }

button.action {
  background: #396b47;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 13px 24px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 0 #234a31;
}

footer {
  text-align: center;
  padding: 25px;
  font-size: 12px;
  line-height: 2;
}

footer a { color: #315c42; }

#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 100;
}

.paper {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 15px;
  animation: fall 4s linear forwards;
}

@keyframes fall {
  to {
    transform: translate(var(--drift), 110vh) rotate(850deg);
  }
}

@media (max-width: 600px) {
  main { padding: 9px; }
  .panel { padding: 12px; }
  .stamp-book { grid-template-columns: repeat(4, 1fr); }
  .avatar { width: 60px; }
  .map { aspect-ratio: 1 / 1; }
  .pin-name { max-width: 75px; padding: 3px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

const NS = "http://www.w3.org/2000/svg";

function addArt(parent, symbol, x, y, scale, color) {
  const item = document.createElementNS(NS, "use");
  item.setAttribute("href", "#" + symbol);
  item.setAttribute(
    "transform",
    `translate(${x} ${y}) scale(${scale})`
  );
  if (color) item.setAttribute("color", color);
  parent.appendChild(item);
}

// 木々のまとまりを配置
const groves = [
  [45,360], [80,430], [165,455],
  [245,495], [320,555], [490,590],
  [720,540], [820,460], [855,365],
  [420,55], [590,80], [430,300],
  [550,350], [55,90], [850,160],
  [110,555], [780,610]
];

groves.forEach(([cx, cy], index) => {
  for (let i = 0; i < 9; i++) {
    const angle = i * 2.4;
    const radius = 12 + i * 4;

    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;

    addArt(
      $("forest"),
      (i + index) % 3 === 0 ? "birch" : "pine",
      x, y, .55 + (i % 4) * .13
    );
  }
});

// 色とりどりの花
const flowerColors = [
  "#e5a6cb", "#fff6d2", "#a59cdd", "#f1cb60"
];

const meadows = [
  [160,520], [365,595], [680,455], [400,365]
];

meadows.forEach(([cx, cy]) => {
  for (let i = 0; i < 30; i++) {
    const x = cx + Math.cos(i * 2.4) * (8 + i);
    const y = cy + Math.sin(i * 2.4) * (8 + i) * .5;

    addArt(
      $("flowers"), "flower", x, y,
      .7 + (i % 3) * .15,
      flowerColors[i % flowerColors.length]
    );
  }
});

// =================================
// ピンとスタンプカード
// =================================

spots.forEach((spot, i) => {
  const pin = document.createElement("button");

  pin.className = "pin";
  pin.id = "pin-" + i;
  pin.style.left = spot.x + "%";
  pin.style.top = spot.y + "%";

  pin.innerHTML = `
    <span class="pin-icon">${spot.icon}</span>
    <span class="pin-name"></span>
  `;

  pin.addEventListener("click", () => visit(i));
  map.appendChild(pin);

  const stamp = document.createElement("div");

  stamp.className = "stamp";
  stamp.id = "stamp-" + i;

  stamp.innerHTML = `
    <span class="stamp-icon">${spot.icon}</span>
    <span class="stamp-name"></span>
  `;

  $("stampBook").appendChild(stamp);
});

// =================================
// 言語切り替え
// =================================

function render() {
  const t = translations[lang];

  document.documentElement.lang =
    lang === "zh" ? "zh-Hans" :
    lang === "tw" ? "zh-Hant" : lang;

  document.title = t.title;

  document.querySelectorAll("[data-t]").forEach(el => {
    el.textContent = t[el.dataset.t];
  });

  spots.forEach((spot, i) => {
    const name = spot[lang][0];
    const pin = $("pin-" + i);
    const stamp = $("stamp-" + i);

    pin.querySelector(".pin-name").textContent = name;
    pin.querySelector(".pin-icon").textContent =
      visited.has(i) ? "⭐" : spot.icon;

    pin.setAttribute("aria-label", name);
    pin.setAttribute("aria-pressed", String(selected === i));

    pin.classList.toggle("visited", visited.has(i));
    pin.classList.toggle("selected", selected === i);

    stamp.querySelector(".stamp-name").textContent = name;
    stamp.classList.toggle("earned", visited.has(i));
  });

  const count = visited.size;

  $("progressText").textContent = count + " / " + spots.length;
  $("progressBar").style.width = count / spots.length * 100 + "%";

  document.querySelector(".progress")
    .setAttribute("aria-valuenow", count);

  document.querySelector(".progress")
    .setAttribute("aria-label", t.progress);

  let rank = 0;
  if (count >= 1) rank = 1;
  if (count >= 3) rank = 2;
  if (count >= 5) rank = 3;
  if (count === spots.length) rank = 4;

  $("rank").textContent = "🏅 " + t.ranks[rank];

  if (selected === -1) {
    $("spotTitle").textContent = t.startTitle;
    $("spotDescription").textContent = t.startMessage;
    $("spotDetails").hidden = true;
  } else {
    const spot = spots[selected];
    const data = spot[lang];

    $("spotTitle").textContent = spot.icon + " " + data[0];
    $("spotDescription").textContent = data[1];
    $("spotActivity").textContent = data[2];
    $("spotTrivia").textContent = data[3];
    $("reward").textContent = newStamp ? t.reward : t.again;
    $("spotDetails").hidden = false;
  }

  $("clearPanel").hidden = count !== spots.length;
}

$("language").addEventListener("change", event => {
  lang = event.target.value;
  render();
});

// =================================
// 観光地を発見
// =================================

function visit(index) {
  selected = index;

  const spot = spots[index];

  newStamp = !visited.has(index);
  visited.add(index);

  bear.style.left = spot.x + "%";
  bear.style.top = Math.max(12, spot.y - 4) + "%";

  render();

  if (visited.size === spots.length && newStamp) {
    celebrate();
  }

  $("info").scrollIntoView({
    behavior: reducedMotion ? "auto" : "smooth",
    block: "nearest"
  });
}

// =================================
// 全クリア時の紙吹雪
// =================================

function celebrate() {
  if (reducedMotion) return;

  const colors = [
    "#e9c35c", "#83b96b", "#8ad1df",
    "#e9a7c3", "#b9a6e2"
  ];

  for (let i = 0; i < 100; i++) {
    const paper = document.createElement("div");

    paper.className = "paper";
    paper.style.left = Math.random() * 100 + "%";
    paper.style.background = colors[i % colors.length];

    paper.style.animationDelay = Math.random() + "s";
    paper.style.animationDuration =
      2.5 + Math.random() * 2 + "s";

    paper.style.setProperty(
      "--drift",
      Math.random() * 300 - 150 + "px"
    );

    $("confetti").appendChild(paper);

    setTimeout(() => paper.remove(), 6000);
  }
}

// =================================
// リセット
// =================================

$("reset").addEventListener("click", () => {
  visited.clear();
  selected = -1;
  newStamp = false;

  bear.style.left = "65%";
  bear.style.top = "91%";

  $("confetti").replaceChildren();

  render();

  window.scrollTo({
    top: 0,
    behavior: reducedMotion ? "auto" : "smooth"
  });
});

// 初期表示
render();

</script>
</body>
</html>
